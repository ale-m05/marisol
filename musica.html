<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MI CORAZON DE MELON</title>
<!-- Enlace de respaldo para asegurar que carguen los iconos de los botones siempre -->
<link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #ffe6f0, #ffd1dc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        text-align: center;
        border-radius: 25px;
        padding: 30px 50px;
        background: transparent;
        box-shadow: none; 
    }

    .container img {
        width: 300px;
        margin-bottom: 20px;
        border-radius: 20px;
    }

    .reproductor {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 20px 0;
    }

    .btn-musica {
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent; 
        border: 2px solid #ff6b6b; 
        color: #ff6b6b; 
        padding: 12px 25px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-musica:hover {
        background: rgba(255, 107, 107, 0.2); 
    }

    .btn-musica i {
        font-size: 18px;
    }

    .btn-romantico {
        display: inline-block;
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        color: #ff6b6b;
        background: transparent; 
        border: 2px solid #ff6b6b;
        border-radius: 25px;
        text-decoration: none;
        transition: 0.4s;
    }

    .btn-romantico:hover {
        background: rgba(255, 107, 107, 0.2); 
    }
</style>
</head>
<body>

<div class="container">
    <!-- ENLACE DE IMAGEN FIJO PARA LOS GIRASOLES -->
    <img src="https://png.pngtree.com/png-vector/20240925/ourmid/pngtree-sunflower-bouquet-png-image_13876675.png" alt="Ramo de Girasoles">

    <p><b>🌸TE DEDICO ESTA CANCION MI CORAZON DE MELON🌸</b></p>
    
    <div class="reproductor">
        <button class="btn-musica" onclick="reproducirMusica()">
            <i class="fas fa-play"></i> Reproducir
        </button>

        <button class="btn-musica" onclick="pausarMusica()">
            <i class="fas fa-pause"></i> Pausar
        </button>
    </div>

    <!-- REPRODUCTOR CLÁSICO APUNTANDO A TU ARCHIVO LOCAL -->
    <audio id="musica" loop>
        <source src="mrr.mp3" type="audio/mpeg">
        Tu navegador no soporta la reproducción de audio.
    </audio>

    <a href="carta.html" class="btn-romantico">ABRIR</a>
</div>

<script>
    // 1. Declaramos primero cuál es el elemento de audio que va a sonar
    const miMusica = document.getElementById('musica');

    // 2. Definimos las funciones encargadas de controlar el reproductor
    function reproducirMusica() {
        miMusica.play().catch(error => {
            console.log("El navegador requiere interacción del usuario antes de reproducir audio.");
        });
    }

    function pausarMusica() {
        miMusica.pause();
    }

    // 3. Script para capturar el inicio automático al venir desde login.html
    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autostart') === 'true') {
            setTimeout(() => {
                reproducirMusica();
            }, 300);
        }
    });
</script>  
</body>
</html>
