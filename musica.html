<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Se añade maximum-scale y user-scalable para evitar saltos de pantalla extraños en pantallas de iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MI CORAZON DE MELON</title>
<!-- CORRECCIÓN: Enlace oficial y real de FontAwesome para que se carguen los iconos de Play y Pause -->
<link rel="stylesheet" href="https://cloudflare.com">
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Fuentes nativas de iOS */
        background: linear-gradient(135deg, #d7d6df, #9b6f7a);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        text-align: center;
        border-radius: 25px;
        padding: 20px 30px;
        background: transparent;
        box-shadow: none; 
        width: 90%;
        max-width: 400px;
    }

    .container img {
        width: 100%;
        max-width: 280px;
        height: auto;
        margin-bottom: 20px;
        border-radius: 20px;
    }

    .reproductor {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 25px 0;
    }

    .btn-musica {
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent; 
        border: 2px solid #473e3e; 
        color: #4b4444; 
        padding: 12px 22px;
        border-radius: 50px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        -webkit-appearance: none; /* Evita que iOS altere la forma del botón */
    }

    .btn-musica:hover, .btn-musica:active {
        background: rgba(255, 107, 107, 0.2); 
    }

    .btn-musica i {
        font-size: 16px;
    }

    .btn-romantico {
        display: inline-block;
        padding: 15px 40px;
        font-size: 18px;
        font-weight: bold;
        color: #362d2d;
        background: transparent; 
        border: 2px solid #413838;
        border-radius: 25px;
        text-decoration: none;
        transition: 0.4s;
        -webkit-appearance: none;
    }

    .btn-romantico:hover {
        background: rgba(255, 107, 107, 0.2); 
    }
</style>
</head>
<body>

<div class="container">
    <!-- ENLACE DE IMAGEN FIJO PARA LOS GIRASOLES -->
    <img src="mer.png" alt="Ramo de Girasoles">

    <p><b>🌸TE DEDICO ESTA CANCION MI CORAZON DE MELON🌸</b></p>
    
    <div class="reproductor">
        <!-- El botón ahora incluye una función especial para saltarse el bloqueo de audio de Apple -->
        <button class="btn-musica" id="playBtn" onclick="reproducirMusica()">
            <i class="fas fa-play"></i> Reproducir
        </button>

        <button class="btn-musica" onclick="pausarMusica()">
            <i class="fas fa-pause"></i> Pausar
        </button>
    </div>

    <!-- REPRODUCTOR APUNTANDO A TU ARCHIVO LOCAL (Se añade playsinline para compatibilidad móvil) -->
    <audio id="musica" loop playsinline>
        <source src="mrr.mp3" type="audio/mpeg">
        Tu navegador no soporta la reproducción de audio.
    </audio>

    <a href="carta.html" class="btn-romantico">ABRIR</a>
</div>

<script>
    const miMusica = document.getElementById('musica');

    function reproducirMusica() {
        // Forzamos al iPhone a cargar y despertar el archivo de audio tras la pulsación
        miMusica.load(); 
        
        const playPromise = miMusica.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("Reproduciendo con éxito en iOS");
            }).catch(error => {
                console.log("Error al reproducir: ", error);
            });
        }
    }

    function pausarMusica() {
        miMusica.pause();
    }

    // Solución para iPhones: Intentar reproducir usando el evento de toque de pantalla si venía redirigido
    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autostart') === 'true') {
            // Creamos un disparador: En cuanto la persona toque CUALQUIER parte de la pantalla, la música sonará de inmediato.
            const iniciarAudioEnPrimerToque = () => {
                reproducirMusica();
                document.removeEventListener('touchstart', iniciarAudioEnPrimerToque);
                document.removeEventListener('click', iniciarAudioEnPrimerToque);
            };
            
            document.addEventListener('touchstart', iniciarAudioEnPrimerToque);
            document.addEventListener('click', iniciarAudioEnPrimerToque);
        }
    });
</script>  
</body>
</html>
